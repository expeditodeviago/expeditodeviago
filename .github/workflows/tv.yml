name: Atualizar TV (contribuicoes reais)

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia, 03:00 no horario de Brasilia
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/generate-tv.ps1"]

permissions:
  contents: write

jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar GIF com as contribuicoes do dia
        shell: powershell
        run: ./scripts/generate-tv.ps1 -User "${{ github.repository_owner }}"

      - name: Commitar se mudou
        shell: bash
        run: |
          git config user.name "vico-04[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tv-truman-grid.gif
          git diff --cached --quiet && echo "Nada mudou na grade." && exit 0
          git commit -m "chore(tv): Vico-04 atualizou a grade do dia"
          git push

