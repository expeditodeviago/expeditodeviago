name: Atualizar Estudio Canal 04

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia, 03:00 BRT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-tv.ps1"
      - "scripts/build-panels.ps1"

permissions:
  contents: write

jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar TV 2.5D e telemetria do console
        shell: powershell
        run: |
          ./scripts/build-panels.ps1 -User "${{ github.repository_owner }}"
          ./scripts/generate-tv.ps1 -User "${{ github.repository_owner }}"

      - name: Publicar se houve mudanca
        shell: bash
        run: |
          git config user.name "Iago Expedito"
          git config user.email "261275987+expeditodeviago@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet && echo "Sinal inalterado." && exit 0
          git commit -m "chore(studio): atualizar grade 2.5D e telemetria do Canal 04"
          git push
