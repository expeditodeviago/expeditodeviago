name: Atualizar Commit Breaker

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia as 03:00 BRT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-profile.ps1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simular partida sobre os commits reais do dia
        shell: powershell
        run: ./scripts/build-profile.ps1 -User "${{ github.repository_owner }}"

      - name: Commitar se o mapa mudou
        shell: bash
        run: |
          git config user.name "Iago Expedito"
          git config user.email "261275987+expeditodeviago@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet && echo "Sem mudancas nos commits." && exit 0
          git commit -m "chore(game): atualizar partida do Commit Breaker com novos commits"
          git push
