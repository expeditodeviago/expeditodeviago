name: Atualizar Pragmata Commit Protocol

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia as 03:00 BRT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-profile.ps1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar Banner, Matriz SVG e Dados do Jogo Interativo
        shell: powershell
        run: ./scripts/build-profile.ps1 -User "${{ github.repository_owner }}"

      - name: Commitar se houver novos commits
        shell: bash
        run: |
          git config user.name "Iago Expedito"
          git config user.email "261275987+expeditodeviago@users.noreply.github.com"
          git add assets/ docs/commits-data.js
          git diff --cached --quiet && echo "Sem mudancas nos commits." && exit 0
          git commit -m "chore(pragmata): atualizar matriz e jogo interativo com novos commits"
          git push
